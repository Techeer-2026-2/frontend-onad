name: "Codex Task"
description: "Create a structured task from a Notion requirement"
title: "[Notion TODO-XXX] "
body:
  - type: markdown
    attributes:
      value: |
        이 이슈는 Notion 요구사항을 기반으로 생성된 작업입니다.
        구현 전 기존 코드와 프로젝트 구조를 확인하고, 명시된 범위만 작업하세요.

  - type: input
    id: todo_id
    attributes:
      label: "Notion TODO ID"
      description: "Notion 데이터베이스에서 사용하는 고유 작업 ID"
      placeholder: "TODO-001"
    validations:
      required: true

  - type: dropdown
    id: task_type
    attributes:
      label: "작업 유형"
      options:
        - feat
        - fix
        - refactor
        - docs
        - test
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "작업 목적"
      description: "무엇을 왜 구현해야 하는지 작성하세요."
      placeholder: "작업의 목적과 배경"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "작업 범위"
      description: "이번 이슈에서 구현할 항목과 제외할 항목을 구분하세요."
      placeholder: |
        포함:
        - ...

        제외:
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "완료 조건"
      description: "작업 완료 여부를 판단할 수 있는 조건"
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: technical_notes
    attributes:
      label: "기술 참고사항 및 API 계약"
      description: "관련 API, 컴포넌트, 디자인, 제약사항 등을 작성하세요."
      placeholder: "관련 파일 경로, API 명세, 참고사항"

  - type: textarea
    id: verification
    attributes:
      label: "검증 방법"
      description: "완료 후 실행할 테스트 및 확인 사항"
      placeholder: |
        - [ ] 린트
        - [ ] 빌드
        - [ ] 관련 기능 테스트
